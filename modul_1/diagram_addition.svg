<svg xmlns="http://www.w3.org/2000/svg" width="800" height="775" viewBox="0 0 800 775" role="img"><title>Сложение двух чисел</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b5fae"/></marker></defs><style>text{font-family:Arial,sans-serif;text-anchor:middle;fill:#fff;font-size:21px}.shape{fill:#527feb;stroke:#3b5fae;stroke-width:3;stroke-linejoin:round}.line{fill:none;stroke:#3b5fae;stroke-width:2;marker-end:url(#a)}.label{fill:#314b80;font-size:19px}</style><rect width="800" height="775" fill="white"/><rect class="shape" x="290" y="25" width="220" height="60" rx="25"/><text x="400" y="63">Начало</text><path class="line" d="M400 85V120"/><path class="shape" d="M160 120H660L640 200H140Z"/><text x="400" y="153"><tspan x="400" dy="0">Вывод:</tspan><tspan x="400" dy="27">«Введите числа для сложения: »</tspan></text><path class="line" d="M400 200V235"/><path class="shape" d="M160 235H660L640 315H140Z"/><text x="400" y="283"><tspan x="400" dy="0">Ввод x (целое число)</tspan></text><path class="line" d="M400 315V350"/><path class="shape" d="M160 350H660L640 430H140Z"/><text x="400" y="398"><tspan x="400" dy="0">Ввод y (целое число)</tspan></text><path class="line" d="M400 430V465"/><rect class="shape" x="250" y="465" width="300" height="70"/><text x="400" y="508">Вычислить x + y</text><path class="line" d="M400 535V570"/><path class="shape" d="M160 570H660L640 650H140Z"/><text x="400" y="618"><tspan x="400" dy="0">Вывод: «Сумма чисел: », x + y</tspan></text><path class="line" d="M400 650V685"/><rect class="shape" x="290" y="685" width="220" height="60" rx="25"/><text x="400" y="723">Конец</text></svg>
