<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img"><title>Деление с проверкой делителя</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b5fae"/></marker></defs><style>text{font-family:Arial,sans-serif;text-anchor:middle;fill:#fff;font-size:21px}.shape{fill:#527feb;stroke:#3b5fae;stroke-width:3;stroke-linejoin:round}.line{fill:none;stroke:#3b5fae;stroke-width:2;marker-end:url(#a)}.label{fill:#314b80;font-size:19px}</style><rect width="800" height="1000" fill="white"/><rect class="shape" x="290" y="25" width="220" height="60" rx="25"/><text x="400" y="63">Начало</text><path class="line" d="M400 85V120"/><path class="shape" d="M160 120H660L640 200H140Z"/><text x="400" y="153"><tspan x="400" dy="0">Вывод:</tspan><tspan x="400" dy="27">«Введите числа для деления: »</tspan></text><path class="line" d="M400 200V235"/><path class="shape" d="M160 235H660L640 315H140Z"/><text x="400" y="283"><tspan x="400" dy="0">Ввод x (целое число)</tspan></text><path class="line" d="M400 315V350"/><path class="shape" d="M160 350H660L640 430H140Z"/><text x="400" y="398"><tspan x="400" dy="0">Ввод y (целое число)</tspan></text><path class="line" d="M400 430V465"/><path class="shape" d="M400 465L540 535L400 605L260 535Z"/><text x="400" y="542">y != 0?</text><path class="line" d="M260 535H195V645"/><path class="line" d="M540 535H605V745"/><text class="label" x="225" y="520">Да</text><text class="label" x="575" y="520">Нет</text><rect class="shape" x="55" y="645" width="280" height="65"/><text x="195" y="686">Вычислить x / y</text><path class="line" d="M195 710V745"/><path class="shape" d="M45 745H365L345 825H25Z"/><text x="195" y="778"><tspan x="195" dy="0">Вывод:</tspan><tspan x="195" dy="27">«Результат: », x / y</tspan></text><path class="shape" d="M455 745H775L755 825H435Z"/><text x="605" y="778"><tspan x="605" dy="0">Вывод:</tspan><tspan x="605" dy="27">«На ноль делить нельзя!»</tspan></text><path d="M195 825V875H605V825" fill="none" stroke="#3b5fae" stroke-width="2"/><path class="line" d="M400 875V910"/><rect class="shape" x="290" y="910" width="220" height="60" rx="25"/><text x="400" y="948">Конец</text></svg>
