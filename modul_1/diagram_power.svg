<svg xmlns="http://www.w3.org/2000/svg" width="540" height="750" viewBox="0 0 540 750" role="img" aria-labelledby="title desc">
  <title id="title">Возведение числа в степень</title>
  <desc id="desc">Начало, ввод n и m, вычисление n ** m, вывод результата, конец.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#527feb"/>
    </marker>
  </defs>
  <rect width="540" height="750" fill="white"/>
  <g fill="none" stroke="#527feb" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 105 V164"/>
    <path d="M270 253 V299"/>
    <path d="M270 402 V461"/>
    <path d="M270 550 V609"/>
  </g>
  <g fill="#527feb" stroke="#3b5fae" stroke-width="4" stroke-linejoin="round">
    <rect x="148" y="32" width="244" height="73" rx="14"/>
    <path d="M132 167 H428 L406 253 H110 Z"/>
    <rect x="172" y="301" width="196" height="101"/>
    <path d="M132 463 H428 L406 550 H110 Z"/>
    <rect x="148" y="611" width="244" height="73" rx="14"/>
  </g>
  <g fill="white" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="270" y="78" font-size="28">Начало</text>
    <text x="270" y="220" font-size="28">Ввод n и m</text>
    <text x="270" y="333" font-size="21">
      <tspan x="270">n ** m (операция</tspan>
      <tspan x="270" dy="25">возведения в</tspan>
      <tspan x="270" dy="25">степень)</tspan>
    </text>
    <text x="270" y="486" font-size="25">
      <tspan x="270">n ** m (результат</tspan>
      <tspan x="270" dy="28">возведения в</tspan>
      <tspan x="270" dy="28">степень)</tspan>
    </text>
    <text x="270" y="657" font-size="28">Конец</text>
  </g>
</svg>
